<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="Viewport"
          content="width=device-width, initial-scale=1.0">
    <title>SIKA -Form mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SIKA</h1>
        <p>Sistem Informasi Akademik</p>
    </header>

    <nav aria-label="Navigasi Utama">
        <ul>
            <li><a href="index.html">Dasboard</a></li>
            <li><a href="Mahasiswa.html">Profil mahasiswa</li>
            <li><a href="form-mahasiswa.html">Form Mahasiswa</a></li>
        </ul>
    </nav>

    <main>
        <h1>Form Data Mahasiswa</h1>

        <form Action="#" method="post">
            <div>
                <label for="nim">NIM</label>
                <input type="text"
                       id="nim"
                       name="nim"
                       minleght="8"
                       maxleght="15"
                       required>
            </div>

            <div>
                <label for="nama">Nama Lengkap</label>
                <input type="text"
                       id="nama"
                       name="nama"
                       minleght="3"
                       required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       name="email"
                       required>
            </div>
            <div>
                <label for="prodi">Program Studi</label>
                <select id="prodi" name="prodi"required>
                    <option value="">-- pilih--</option>
                    <option value="TI">Teknik Informatika</option>
                    <option value="SI">Sistem Informasi</option>
                </select>
            </div>

            <div>
                <label for="angkatan">Angkatan</label>
                <input type="number"
                       id="angkatan"
                       name="angkatan"
                       min="2020"
                       max="2030"
                       required>

            </div>

            <fielset>
                <legend>Status Akademik</legend>

                <input type="radio"
                       id="aktif"
                       name="status"
                       value="nonaktif">
                <label for="nonaktif">Nonaktif</label>
            </fielset>

            <buton type="submit">Simpan</buton>
            <buton type="reset">Reset</buton>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 SIKA</p>
    </footer>
</body>
</html>
